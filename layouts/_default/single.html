{{ partial "header.html" . }}

<article class="page-container">
    <header class="page-header">
        <h1 class="page-title">{{ .Title }}</h1>
        {{ if .Params.description }}
        <p class="page-description">{{ .Params.description }}</p>
        {{ end }}
    </header>
    
    <div class="page-body">
        {{ .Content }}
    </div>
</article>

{{ partial "footer.html" . }}
